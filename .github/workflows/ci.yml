name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck fawlty tests/test_cli.sh
      - name: ruff (pyflakes + pycodestyle errors)
        run: pipx run ruff==0.6.9 check .
      - name: unit tests (grader, guest registry, guests)
        run: python3 -m unittest discover -s tests -v
      - name: CLI behavioural tests (stub kubectl)
        run: tests/test_cli.sh
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -t fawlty-tower:ci .
      - name: no FAWLTY_GUEST exits 2 with a helpful message
        run: |
          rc=0; out=$(docker run --rm fawlty-tower:ci 2>&1) || rc=$?
          echo "$out"
          test "$rc" -eq 2
          grep -q "set FAWLTY_GUEST" <<<"$out"
      - name: every guest module imports inside the image
        run: |
          docker run --rm --entrypoint python fawlty-tower:ci -c '
          import importlib
          from fawlty.dispatch import GUESTS
          for name, path in GUESTS.items():
              assert callable(importlib.import_module(path).run), name
          print("ok:", ", ".join(GUESTS))'
      - name: victim serves /healthz and stops promptly
        run: |
          docker run -d --name victim -e FAWLTY_GUEST=victim -p 8080:8080 fawlty-tower:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 0.5; done
          curl -fsS localhost:8080/healthz | grep -qx ok
          start=$(date +%s); docker stop -t 10 victim; end=$(date +%s)
          docker logs victim
          test $((end - start)) -lt 5
