# squatter: hostNetwork pod that binds node port FAWLTY_SQUAT_PORT (default 80)
# and fights the ingress controller for it. Root plus NET_BIND_SERVICE to bind a
# port below 1024. If the port is already held it exits non-zero, so a conflict
# shows up as a crash loop with "Address already in use" rather than a silent pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: squatter
  labels: {app.kubernetes.io/name: squatter, app.kubernetes.io/part-of: fawlty-tower, fawlty.io/tier: node}
spec:
  replicas: 0
  strategy: {type: Recreate}   # two pods can't hold the same host port
  selector:
    matchLabels: {app.kubernetes.io/name: squatter}
  template:
    metadata:
      labels: {app.kubernetes.io/name: squatter, app.kubernetes.io/part-of: fawlty-tower}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsUser: 0
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: guest
          image: fawlty-tower
          env:
            - {name: FAWLTY_GUEST, value: squatter}
            - {name: FAWLTY_SQUAT_PORT, value: "80"}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
