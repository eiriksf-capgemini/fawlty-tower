# Polly: benign ERROR/WARN log storm. FAWLTY_LOG_RATE is lines per second.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polly
  labels:
    app.kubernetes.io/name: polly
    app.kubernetes.io/part-of: fawlty-tower
spec:
  replicas: 0  # checked in/out live by the `fawlty` CLI; tell Argo CD to ignore it
  selector:
    matchLabels:
      app.kubernetes.io/name: polly
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polly
        app.kubernetes.io/part-of: fawlty-tower
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: guest
          image: fawlty-tower
          env:
            - {name: FAWLTY_GUEST, value: "polly"}
            - {name: FAWLTY_LOG_RATE, value: "50"}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
