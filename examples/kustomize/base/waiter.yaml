# The Waiter: slow responses -> probe timeouts / latency. Readiness ONLY, with a
# short timeout. No liveness probe: restarts would make this look like a crash.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waiter
  labels:
    app.kubernetes.io/name: waiter
    app.kubernetes.io/part-of: fawlty-tower
spec:
  replicas: 0  # checked in/out live by the `fawlty` CLI; tell Argo CD to ignore it
  selector:
    matchLabels:
      app.kubernetes.io/name: waiter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: waiter
        app.kubernetes.io/part-of: fawlty-tower
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: guest
          image: fawlty-tower
          env:
            - {name: FAWLTY_GUEST, value: "waiter"}
            - {name: FAWLTY_MIN_DELAY_S, value: "3"}
            - {name: FAWLTY_MAX_DELAY_S, value: "20"}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
