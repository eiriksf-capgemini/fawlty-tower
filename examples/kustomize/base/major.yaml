# The Major: steady egress to a fixed allowlist of public sites. Pair with a
# NetworkPolicy if you want to see blocked egress instead of allowed egress.
# Heads-up: outbound internet traffic from a corporate cluster may reach your SOC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: major
  labels:
    app.kubernetes.io/name: major
    app.kubernetes.io/part-of: fawlty-tower
spec:
  replicas: 0  # checked in/out live by the `fawlty` CLI; tell Argo CD to ignore it
  selector:
    matchLabels:
      app.kubernetes.io/name: major
  template:
    metadata:
      labels:
        app.kubernetes.io/name: major
        app.kubernetes.io/part-of: fawlty-tower
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: guest
          image: fawlty-tower
          env:
            - {name: FAWLTY_GUEST, value: "major"}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
