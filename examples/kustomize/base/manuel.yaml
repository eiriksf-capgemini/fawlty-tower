# Manuel: readiness flaps. Readiness ONLY: a liveness probe on the same endpoint
# would restart him and turn "flapping readiness" into a crash loop, which is a
# different fault and the grader's listed misdiagnosis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manuel
  labels:
    app.kubernetes.io/name: manuel
    app.kubernetes.io/part-of: fawlty-tower
spec:
  replicas: 0  # checked in/out live by the `fawlty` CLI; tell Argo CD to ignore it
  selector:
    matchLabels:
      app.kubernetes.io/name: manuel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manuel
        app.kubernetes.io/part-of: fawlty-tower
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: guest
          image: fawlty-tower
          env:
            - {name: FAWLTY_GUEST, value: "manuel"}
            - {name: FAWLTY_HEALTHY_S, value: "20"}
            - {name: FAWLTY_UNHEALTHY_S, value: "20"}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 1
