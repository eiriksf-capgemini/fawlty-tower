# O'Reilly: Event spam + short-lived Job flood, through his own ServiceAccount
# (see rbac.yaml). POD_NAME/POD_UID let his Events reference his real pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oreilly
  labels:
    app.kubernetes.io/name: oreilly
    app.kubernetes.io/part-of: fawlty-tower
spec:
  replicas: 0  # checked in/out live by the `fawlty` CLI; tell Argo CD to ignore it
  selector:
    matchLabels:
      app.kubernetes.io/name: oreilly
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oreilly
        app.kubernetes.io/part-of: fawlty-tower
    spec:
      serviceAccountName: oreilly
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: guest
          image: fawlty-tower
          env:
            - {name: FAWLTY_GUEST, value: "oreilly"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            # - {name: FAWLTY_JOB_IMAGE, value: "registry.example.com/mirror/busybox:1.36"}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
